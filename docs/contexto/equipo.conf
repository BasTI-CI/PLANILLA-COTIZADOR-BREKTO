# equipo.conf — configuración del equipo por carriles. Lo lee scripts/contexto.sh.
# Lo mantiene el PM. Formato: asignaciones bash (KEY="valor"), sin espacios alrededor del =.

# Roles instalados, en orden de la cadena de ida. Cada uno tiene docs/contexto/contexto-<rol>.md
ROLES="pm pp pg code"

# Módulos avanzados activos (adr, worktrees, migraciones). Vacío = flujo liviano.
MODULOS="worktrees"

# Rama donde se trabaja y ref donde Sebastián integra el trabajo (repo capitalti).
RAMA_TRABAJO="Cotizador_Dev"
REF_INTEGRACION="capitalti/dev"

# Producción: repo de Giovanni (remote "prod", solo lectura), que Netlify publica en
# cotizadormultiple.brekto.com. Ver contexto-comun.md §1.
REF_PRODUCCION="prod/main"

# Tablero. Si TABLERO_REF está vacío, se lee del árbol.
TABLERO_RUTA="docs/TASKS.md"
TABLERO_REF=""
